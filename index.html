<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>가을 컬러헌팅</title>
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
@font-face{font-family:'KIMWILDgag-Bold';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2510-1@1.0/KIMWILDgag-Bold.woff2') format('woff2');font-weight:normal;font-display:swap}
:root{
  --bg:#F7F2EA; --paper:#FFFDF9; --ink:#3B2F27; --sub:#8C7D70; --line:#E7DCCC; --soft:#EFE6DA;
  --c:#3B2F27;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Pretendard',-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
.leaf{width:22px;height:22px;flex:none}

/* ---------- home ---------- */
.home{padding:48px 16px 40px}
.home h1{font-family:'KIMWILDgag-Bold',sans-serif;font-weight:normal;font-size:64px;line-height:1.1}
.foot{padding:44px 0 8px;text-align:center}
.foot img{height:22px;width:auto;opacity:.9}
.stripe{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:28px 0 28px}
.stripe i{flex:1}
.teams{list-style:none;display:grid;gap:10px}
.teams a{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 18px 14px 14px;transition:transform .15s}
.teams a:active{transform:scale(.98)}
.teams .dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.teams .dot .leaf{fill:#fff;color:rgba(0,0,0,.25)}
.teams .name{font-family:'KIMWILDgag-Bold',sans-serif;font-weight:normal;font-size:26px;line-height:1;transform:translateY(-.11em)}
.teams .cnt{margin-left:auto;font-size:13px;color:var(--sub)}
.teams .cnt b{color:var(--ink);font-size:17px;font-weight:800;margin-right:1px}
.ghost{display:block;margin-top:24px;padding:16px;text-align:center;background:var(--ink);color:#fff;border-radius:14px;font-weight:700;font-size:16px}

/* ---------- team ---------- */
.hero{background:var(--c);color:#fff;min-height:180px;padding:52px 16px 18px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.hero .leafbg{position:absolute;right:-26px;top:-26px;width:150px;height:150px;fill:rgba(255,255,255,.14);color:transparent;transform:rotate(25deg)}
.back{position:absolute;left:6px;top:8px;width:44px;height:44px;display:grid;place-items:center;font-size:26px;color:inherit;z-index:1}
.hero h1{font-family:'KIMWILDgag-Bold',sans-serif;font-weight:normal;font-size:52px;line-height:1.1}
.gallery{padding:2px 0 120px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pola{display:block;background:var(--soft)}
.pola img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.pola:active img{opacity:.85}
.empty{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--sub);font-weight:600}
.sk{aspect-ratio:1;background:var(--soft);animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.45}}
.empty .leaf{width:44px;height:44px;fill:none;stroke:var(--c);stroke-width:1;opacity:.6;margin-bottom:10px}
.cta{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(247,242,234,0))}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:14px;background:var(--c);color:#fff;font-weight:800;font-size:17px}
.btn:disabled{opacity:.5}
.btn .leaf{width:18px;height:18px;fill:#fff;color:var(--c)}

/* ---------- sheet ---------- */
.dim{position:fixed;inset:0;background:rgba(30,20,10,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease-out;max-height:90vh;overflow:auto}
.sheet-head{display:flex;align-items:center;margin-bottom:16px}
.sheet-head h3{font-weight:800;font-size:19px}
.sheet-head button{margin-left:auto;font-size:26px;line-height:1;width:36px;height:36px;color:var(--sub)}
.picked{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px}
.picked img{width:76px;height:76px;object-fit:cover;border-radius:8px;flex:none}
.field{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:0 14px;margin-top:8px;font-size:15px;color:var(--ink);outline:none}
.field::placeholder{color:var(--sub)}
.field:focus{border-color:var(--c)}
.sheet .btn{margin-top:16px}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;background:rgba(20,14,8,.92);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
.lb img{max-width:100%;max-height:72vh;border-radius:4px}
.lb .meta{color:#fff;text-align:center;margin-top:16px;max-width:440px}
.lb .meta p{font-weight:600;font-size:16px;line-height:1.5}
.lb .meta small{display:block;margin-top:6px;opacity:.6;font-size:12px}

/* ---------- result ---------- */
.res-head{padding:60px 16px 8px;position:relative}
.res-head h1{font-family:'KIMWILDgag-Bold',sans-serif;font-weight:normal;font-size:64px;line-height:1.1}
.ratio{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:24px 16px 8px;background:var(--line)}
.ratio i{transition:flex .4s}
.legend{display:flex;justify-content:space-between;padding:0 16px;font-size:12px;font-weight:600;color:var(--sub)}
.legend span{display:flex;align-items:center;gap:4px}
.legend em{width:8px;height:8px;border-radius:50%;display:inline-block}
.mosaic{display:grid;grid-template-columns:repeat(5,1fr);margin:24px 0 0}
.mosaic div{aspect-ratio:1;position:relative;overflow:hidden}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block}
.mosaic div::after{content:'';position:absolute;inset:0;background:var(--c);mix-blend-mode:soft-light;opacity:.35}
.mosaic .ph{background:var(--c);opacity:.25}
.rsec{padding:28px 16px 0}
.rsec h2{display:flex;align-items:center;gap:8px;font-family:'KIMWILDgag-Bold',sans-serif;font-weight:normal;font-size:24px;margin-bottom:12px}
.rsec h2 em{width:12px;height:12px;border-radius:50%}
.rsec h2 .nm{transform:translateY(-.11em)}
.rsec h2 small{margin-left:auto;font-family:'Pretendard',sans-serif;font-size:14px;color:var(--sub);font-weight:600}
.row{display:flex;gap:2px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row .pola{width:104px;flex:none}
.row .none{font-size:13px;color:var(--sub);padding:20px 0}
.res-foot{padding:32px 16px 48px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const TEAMS = {
  red:    {no:1, ko:'빨강', c:'#C0432F'},
  orange: {no:2, ko:'주황', c:'#D9772F'},
  yellow: {no:3, ko:'노랑', c:'#D4A11E'},
  brown:  {no:4, ko:'갈색', c:'#875839'},
  khaki:  {no:5, ko:'카키', c:'#6E7343'},
};
const ORDER = ['red','orange','yellow','brown','khaki'];

const LEAF = '<path d="M12 1.5c4.6 3.4 7.5 7.6 7.5 11.6a7.5 7.5 0 0 1-15 0c0-4 2.9-8.2 7.5-11.6z"/><path d="M12 6.5V23" fill="none" stroke="currentColor" stroke-width="1"/>';
const leaf = (cls='leaf') => `<svg class="${cls}" viewBox="0 0 24 24">${LEAF}</svg>`;

/* ---------- 저장소 ----------
   ENDPOINT에 Apps Script 웹앱 주소를 넣으면 구글 드라이브에 저장된다.
   비워두면 이 기기(IndexedDB)에만 저장 — 화면 확인용. */
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxiA34Kd63i9gw21trb9icYxyKaoFI6djNeb4zt9o4Z9gJ_p2ERFd0Z7xhRkoAAq8NwBg/exec';

const toBase64 = blob => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
const byNewest = list => list.sort((a, b) => b.createdAt - a.createdAt);

const DB = (() => {
  let p;
  const open = () => p ||= new Promise((res, rej) => {
    const r = indexedDB.open('colorhunt', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos', {keyPath:'id'});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const q = fn(db.transaction('photos', mode).objectStore('photos'));
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  }); };
  return { all: () => tx('readonly', s => s.getAll()), put: v => tx('readwrite', s => s.put(v)) };
})();

const API = ENDPOINT ? {
  async list() {
    try { return byNewest(await (await fetch(ENDPOINT)).json()); }
    catch (e) { console.error(e); return null; }
  },
  async upload(team, blob, meta) {
    const data = (await toBase64(blob)).split(',')[1];
    // text/plain으로 보내야 Apps Script에서 CORS 사전요청 없이 받는다
    const r = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ team, data, ...meta }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    return j;
  },
} : {
  async list() { return byNewest(await DB.all()); },
  async upload(team, blob, meta) {
    const item = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 8), team, url: await toBase64(blob), ...meta, createdAt: Date.now() };
    await DB.put(item); return item;
  },
};

// 드라이브 사진은 id로 크기별 이미지를 받는다
const src = (p, w) => p.url || `https://lh3.googleusercontent.com/d/${p.id}=w${w}`;

/* ---------- 업로드 전 압축 (긴 변 1600px) ---------- */
function compress(file, max = 1600, q = 0.82) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(u);
      cv.toBlob(b => b ? res(b) : rej(new Error('압축 실패')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('이미지를 읽을 수 없어요')); };
    img.src = u;
  });
}

/* ---------- utils ---------- */
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hhmm = t => new Date(t).toTimeString().slice(0, 5);
const store = {
  get: k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 1800);
}
const setTheme = t => document.documentElement.style.setProperty('--c', t ? TEAMS[t].c : '#3B2F27');
const counts = list => ORDER.reduce((o, k) => (o[k] = list.filter(p => p.team === k).length, o), {});

/* ---------- 홈 ---------- */
function renderHome(list) {
  setTheme(null);
  const n = list && counts(list);
  $app.innerHTML = `
  <main class="home">
    <h1>가을<br>컬러헌팅</h1>
    <div class="stripe">${ORDER.map(k => `<i style="background:${TEAMS[k].c}"></i>`).join('')}</div>
    <ul class="teams">
      ${ORDER.map(k => { const t = TEAMS[k]; return `
      <li><a href="#/team/${k}">
        <span class="dot" style="background:${t.c}">${leaf()}</span>
        <span class="name">${t.ko}</span>
        <span class="cnt">${n ? `<b>${n[k]}</b>장` : ''}</span>
      </a></li>`; }).join('')}
    </ul>
    <a class="ghost" href="#/result">전체 모아보기</a>
    <footer class="foot"><img src="https://cdn.imweb.me/thumbnail/20250530/1404a29fb35b3.png" alt="인천 스펙타클"></footer>
  </main>`;
}

/* ---------- 조 페이지 ---------- */
function renderTeam(k, list) {
  const t = TEAMS[k]; setTheme(k);
  const mine = (list || []).filter(p => p.team === k);
  $app.innerHTML = `
  <header class="hero">
    <a class="back" href="#/">‹</a>
    ${leaf('leafbg')}
    <h1>${t.ko}</h1>
  </header>
  <section class="gallery">
    ${!list ? '<div class="sk"></div>'.repeat(6) : mine.length ? mine.map(p => `<button class="pola" data-id="${p.id}"><img src="${src(p, 500)}" alt="" loading="lazy"></button>`).join('')
      : `<div class="empty">${leaf()}<div>아직 사진이 없어요</div></div>`}
  </section>
  <div class="cta"><label class="btn">${leaf()} 사진 올리기<input type="file" accept="image/*" multiple hidden></label></div>`;

  $app.querySelectorAll('.pola').forEach(b => b.onclick = () => openLightbox(mine.find(p => p.id === b.dataset.id)));
  $app.querySelector('input[type=file]').onchange = e => { if (e.target.files.length) openSheet(k, [...e.target.files]); e.target.value = ''; };
}

function openSheet(k, files) {
  const urls = files.map(f => URL.createObjectURL(f));
  const wrap = document.createElement('div'); wrap.className = 'dim';
  wrap.innerHTML = `
  <div class="sheet">
    <div class="sheet-head"><h3>사진 올리기</h3><button data-x>×</button></div>
    <div class="picked">${urls.map(u => `<img src="${u}" alt="">`).join('')}</div>
    <input class="field" id="nm" placeholder="이름 (선택)" maxlength="12" value="${esc(store.get('ch-name'))}">
    <input class="field" id="cm" placeholder="한마디 (선택)" maxlength="40">
    <button class="btn" id="go">${files.length}장 올리기</button>
  </div>`;
  document.body.appendChild(wrap);
  const close = () => { urls.forEach(URL.revokeObjectURL); wrap.remove(); };
  wrap.onclick = e => { if (e.target === wrap || e.target.hasAttribute('data-x')) close(); };
  wrap.querySelector('#go').onclick = async e => {
    const btn = e.currentTarget, name = wrap.querySelector('#nm').value.trim(), comment = wrap.querySelector('#cm').value.trim();
    store.set('ch-name', name); btn.disabled = true;
    let ok = 0;
    for (const [i, f] of files.entries()) {
      btn.textContent = `올리는 중 ${i + 1}/${files.length}`;
      try { await API.upload(k, await compress(f), { name, comment }); ok++; } catch (err) { console.error(err); }
    }
    close(); await refresh();
    toast(ok === files.length ? '업로드 완료!' : `${files.length - ok}장은 실패했어요`);
  };
}

function openLightbox(p) {
  if (!p) return;
  const el = document.createElement('div'); el.className = 'lb';
  el.innerHTML = `<img src="${src(p, 1600)}" alt="">
    <div class="meta">
      ${p.comment ? `<p>${esc(p.comment)}</p>` : ''}
      <small>${p.name ? esc(p.name) + ' · ' : ''}${hhmm(p.createdAt)}</small>
    </div>`;
  el.onclick = () => el.remove();
  document.body.appendChild(el);
}

/* ---------- 전체 결과 ---------- */
function renderResult(data) {
  setTheme(null);
  const list = data || [], n = counts(list);
  const byTeam = k => list.filter(p => p.team === k);
  const tiles = ORDER.flatMap(k => byTeam(k).map(p => ({ k, p })));
  if (!tiles.length) ORDER.forEach(k => tiles.push(...Array(4).fill({ k })));
  while (tiles.length % 5) tiles.push({ k: tiles[tiles.length - 1].k });
  $app.innerHTML = `
  <header class="res-head">
    <a class="back" href="#/">‹</a>
    <h1>우리의 가을</h1>
  </header>
  <div class="ratio">${ORDER.map(k => `<i style="background:${TEAMS[k].c};flex:${n[k]}"></i>`).join('')}</div>
  <div class="legend">${ORDER.map(k => `<span><em style="background:${TEAMS[k].c}"></em>${TEAMS[k].ko} ${n[k]}</span>`).join('')}</div>
  <div class="mosaic">${tiles.map(({ k, p }) => p
      ? `<div style="--c:${TEAMS[k].c}"><img src="${src(p, 300)}" alt="" loading="lazy"></div>`
      : `<div class="ph" style="--c:${TEAMS[k].c}"></div>`).join('')}</div>
  ${ORDER.map(k => { const t = TEAMS[k], ps = byTeam(k); return `
  <section class="rsec" style="--c:${t.c}">
    <h2><em style="background:${t.c}"></em><span class="nm">${t.ko}</span><small>${ps.length}장</small></h2>
    <div class="row">${ps.length ? ps.map(p => `<button class="pola" data-id="${p.id}"><img src="${src(p, 400)}" alt="" loading="lazy"></button>`).join('') : '<span class="none">—</span>'}</div>
  </section>`; }).join('')}
  <div class="res-foot"><footer class="foot"><img src="https://cdn.imweb.me/thumbnail/20250530/1404a29fb35b3.png" alt="인천 스펙타클"></footer></div>`;
  $app.querySelectorAll('.pola').forEach(b => b.onclick = () => {
    const p = list.find(x => x.id === b.dataset.id); setTheme(p.team); openLightbox(p);
  });
}

/* ---------- 라우터 ---------- */
// 화면은 가지고 있는 목록(cache)으로 바로 그리고, 새 목록이 오면 바뀐 경우에만 다시 그린다
let cache = null, current = null, shown = null, inflight = null;
const sigOf = l => l ? l.map(p => p.id).join() : null;
function paint() { shown = sigOf(cache); current(cache); }
function refresh() {
  return inflight ||= API.list().then(list => {
    inflight = null;
    if (!list) return;
    cache = list;
    if (sigOf(cache) !== shown && !document.querySelector('.dim,.lb')) paint();
  });
}

function route() {
  const q = new URLSearchParams(location.search).get('team');
  if (q && TEAMS[q] && !location.hash) history.replaceState(null, '', '#/team/' + q);
  const [, page, id] = (location.hash.slice(1) || '/').split('/');
  window.scrollTo(0, 0);
  current = page === 'team' && TEAMS[id] ? l => renderTeam(id, l) : page === 'result' ? renderResult : renderHome;
  paint(); refresh();
}
window.addEventListener('hashchange', route);
route();

// 다른 사람이 올린 사진이 보이도록 20초마다 확인
setInterval(() => { if (!document.hidden) refresh(); }, 20000);
</script>
</body>
</html>
